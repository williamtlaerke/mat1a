<!doctype html><html lang="da"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mat1a"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f4ff">
<link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png"><link rel="manifest" href="manifest.webmanifest">
<title>Mat1a</title>
<style>
:root{--bg:#f6f4ff;--card:#fff;--ink:#22243a;--muted:#6b6f86;--line:#e6e1f7;--accent:#7b61ff;--bad:#e5484d;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#15142a;--card:#1f1d3a;--ink:#f2f0ff;--muted:#a9a6c8;--line:#34315a;--accent:#a99bff;--bad:#ff6b6f;color-scheme:dark}}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:600 16px/1.4 system-ui,-apple-system,'Nunito',sans-serif;display:grid;place-items:center;padding:env(safe-area-inset-top) max(16px,env(safe-area-inset-right)) env(safe-area-inset-bottom) max(16px,env(safe-area-inset-left));box-sizing:border-box}
form{width:min(340px,100%);background:var(--card);border:2px solid var(--line);border-radius:24px;padding:26px 22px;display:grid;gap:14px;text-align:center;box-shadow:0 6px 0 var(--line)}
img{width:84px;height:84px;border-radius:22px;justify-self:center}
h1{margin:0;font-size:26px;font-weight:900}
p{margin:0;color:var(--muted);font-size:14px}
input[type=password]{font:inherit;font-size:17px;padding:13px 14px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);text-align:center}
input[type=password]:focus{outline:3px solid var(--accent);outline-offset:1px}
label{display:flex;gap:8px;align-items:center;justify-content:center;color:var(--muted);font-size:14px}
button{font:inherit;font-weight:900;font-size:17px;padding:13px;border:0;border-radius:14px;background:var(--accent);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 60%,#000);cursor:pointer}
button:disabled{opacity:.6}
.err{color:var(--bad);font-size:14px;min-height:1.2em}
.boot{color:var(--muted);font-size:15px}
</style></head><body>
<div class="boot" id="boot">Åbner Mat1a …</div>
<form id="f" hidden autocomplete="off">
  <img src="icon-180.png" alt="">
  <h1>Mat1a</h1>
  <p>Skriv din adgangskode. Telefonen husker den bagefter, så appen også virker uden net.</p>
  <input type="password" id="pw" placeholder="Adgangskode" autocapitalize="none" autocorrect="off" spellcheck="false" aria-label="Adgangskode">
  <label><input type="checkbox" id="rem" checked> Husk på denne telefon</label>
  <button id="go">Lås op</button>
  <div class="err" id="err" role="alert"></div>
</form>
<script>
const META={"salt": "gshD8pELBCSg1Cy5NbWEAw==", "it": 310000, "v": "492aa6e888", "keys": ["F8IKb8wRp3rQ/C1jSEOSfTe7nO4vR+eNZamR1DiTCXMjqNEnPG86/28qji+WWpKOywimKMtXGIoL7XR/"]};
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const KEYNAME='mat1a-nøgle';
async function data(){const r=await fetch('app.bin').catch(()=>caches.match('app.bin'));if(!r||!r.ok)throw new Error('net');return new Uint8Array(await r.arrayBuffer())}
async function open_(key,buf){const iv=buf.slice(0,12),ct=buf.slice(12);const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct);return new TextDecoder().decode(pt)}
function boot(html){document.open();document.write(html);document.close()}
async function derive(pw){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(META.salt),iterations:META.it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt'])}
(async()=>{let buf;
  try{buf=await data()}catch(e){document.getElementById('boot').textContent='Mat1a kunne ikke hentes. Åbn appen én gang med net, så virker den offline bagefter.';return}
  let saved=null;try{saved=localStorage.getItem(KEYNAME)}catch(e){}
  if(saved){try{const k=await crypto.subtle.importKey('raw',b64(saved),'AES-GCM',false,['decrypt']);return boot(await open_(k,buf))}catch(e){try{localStorage.removeItem(KEYNAME)}catch(_){}}}
  document.getElementById('boot').hidden=true;const f=document.getElementById('f');f.hidden=false;document.getElementById('pw').focus();
  f.onsubmit=async ev=>{ev.preventDefault();const btn=document.getElementById('go'),err=document.getElementById('err');btn.disabled=true;btn.textContent='Låser op …';err.textContent='';
    try{const kek=await derive(document.getElementById('pw').value);let k=null,html=null;
      // Williams kode er selve indholdsnøglen; andres kode låser en krypteret kopi af den op
      try{html=await open_(kek,buf);k=kek}catch(e){
        for(const w of META.keys||[]){try{const wb=b64(w);const raw=await crypto.subtle.decrypt({name:'AES-GCM',iv:wb.slice(0,12)},kek,wb.slice(12));k=await crypto.subtle.importKey('raw',raw,'AES-GCM',true,['decrypt']);break}catch(_){}}
        if(!k)throw new Error('kode');html=await open_(k,buf)}
      if(document.getElementById('rem').checked){try{const raw=new Uint8Array(await crypto.subtle.exportKey('raw',k));localStorage.setItem(KEYNAME,btoa(String.fromCharCode(...raw)))}catch(e){}}
      boot(html)}
    catch(e){err.textContent='Forkert adgangskode. Prøv igen.';btn.disabled=false;btn.textContent='Lås op'}}
})();
</script></body></html>
